deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Ensure target directories exist on EC2
      - name: Create remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/3tier_application/database

      # Step 2: Copy files
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,database/init.sql"
          target: "/home/ubuntu/3tier_application"

      # Step 3: SSH and Deploy
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/3tier_application
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "pgprakash" --password-stdin
            sudo docker pull pgprakash/3tier-frontend:latest
            sudo docker pull pgprakash/3tier-backend:latest
            sudo docker compose down --remove-orphans || true
            sudo docker compose up -d
            sleep 20
            sudo docker compose ps
